<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MoMo Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark" style="width:44px;height:44px;font-size:20px;">M</div>
      <div style="margin-top:10px;">
        <div style="font-size:18px;font-weight:700;color:#e8f0fb;">MoMo Shield</div>
        <div style="font-size:10px;color:#4a6080;letter-spacing:1.5px;text-transform:uppercase;">Fraud Detection System</div>
      </div>
    </div>

    {% if form.errors %}
    <div class="alert alert-error" style="margin-bottom:16px;">Invalid username or password.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;">Sign In</button>
    </form>

    <div style="text-align:center;margin-top:20px;font-size:12px;color:#4a6080;">
      Don't have an account? <a href="{% url 'accounts:register' %}" style="color:#0099ff;">Register</a>
    </div>
  </div>
</div>
</body>
</html>
